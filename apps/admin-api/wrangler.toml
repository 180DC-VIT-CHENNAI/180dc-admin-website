name = "admin-api"
type = "javascript"
main = "./index.ts"
d1_databases = [
  { binding = "DB", database_name = "main", database_id = "<your-d1-id>" }
]
r2_buckets = [
  { binding = "R2", bucket_name = "admin-api-bucket" }
]
kv_namespaces = [
  { binding = "KV", id = "<your-kv-id>" }
]
queues.producers = [
  { binding = "QUEUE", queue_name = "jobs-queue" }
]
