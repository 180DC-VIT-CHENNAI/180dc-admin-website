name = "admin-api"
main = "./index.ts"
compatibility_date = "2024-04-05"

routes = [
  { pattern = "*180dc.shop/api/*", zone_name = "180dc.shop" },
]

[[d1_databases]]
binding = "DB"
database_name = "180dc-db"
database_id = "ee99b36c-b013-4cde-b136-eba5b044bd4b"

[[d1_databases]]
binding = "ARCHIVE_DB"
database_name = "180dc-chat-archive"
database_id = "f376133b-e500-4224-a514-b94c5c05ae8e"  # Create in Cloudflare dashboard → Workers & Pages → D1

[[kv_namespaces]]
binding = "AUTH_SESSIONS"
id = "83ebac816f4b44b7bc4419c2e898cd59"
preview_id = "15fff5efa3dc4fb495e815f55f819fa2"

[[durable_objects.bindings]]
name = "CHAT_ROOM"
class_name = "ChatRoomDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ChatRoomDO"]

[[r2_buckets]]
binding = "CLUB_FILES"
bucket_name = "180dc-club-files"

[[r2_buckets]]
binding = "BLOG_IMAGES"
bucket_name = "180dc-blog-images"

[[queues.producers]]
binding = "QUEUE"
queue = "jobs-queue"
