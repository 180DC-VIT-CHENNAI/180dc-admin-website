name = "admin-api"
main = "./index.ts"
compatibility_date = "2024-04-05"
compatibility_flags = ["nodejs_compat"]

routes = [
  { pattern = "*180dcvitc.org/api/*", zone_name = "180dcvitc.org" },
]

[[d1_databases]]
binding = "DB"
database_name = "180dc-db"
database_id = "ee99b36c-b013-4cde-b136-eba5b044bd4b"

[[kv_namespaces]]
binding = "AUTH_SESSIONS"
id = "83ebac816f4b44b7bc4419c2e898cd59"
preview_id = "15fff5efa3dc4fb495e815f55f819fa2"

[[r2_buckets]]
binding = "CLUB_FILES"
bucket_name = "180dc-club-files"
preview_bucket_name = "preview-180dc-club-files"

[[r2_buckets]]
binding = "BLOG_IMAGES"
bucket_name = "180dc-blog-images"
preview_bucket_name = "preview-180dc-blog-images"

[[r2_buckets]]
binding = "CASE_STUDIES"
bucket_name = "180dc-case-studies"
preview_bucket_name = "preview-180dc-case-studies"

[[queues.producers]]
binding = "QUEUE"
queue = "jobs-queue"

